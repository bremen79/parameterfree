name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build and check distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          from email.parser import Parser
          import os
          from pathlib import Path
          import zipfile

          wheel, = Path('dist').glob('*.whl')
          with zipfile.ZipFile(wheel) as archive:
              metadata_file, = (name for name in archive.namelist()
                                if name.endswith('.dist-info/METADATA'))
              metadata = Parser().parsestr(archive.read(metadata_file).decode('utf-8'))
          expected = 'v' + metadata['Version']
          actual = os.environ['RELEASE_TAG']
          if actual != expected:
              raise SystemExit('Release tag {!r} must match {!r}'.format(actual, expected))
          print('Publishing {} {}'.format(metadata['Name'], metadata['Version']))
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/parameterfree
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
