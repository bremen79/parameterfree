name: Tests

on: [push, pull_request]

jobs:
  # Pin the OS so ubuntu-latest migrations do not drop older Python builds.
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . numpy
      - name: Run tests
        run: python -m unittest discover -s tests -v

  compatibility:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - python-version: '3.9'
            torch-version: '1.9.1+cpu'
          - python-version: '3.10'
            torch-version: '2.1.2+cpu'
          - python-version: '3.10'
            torch-version: '2.2.2+cpu'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2'
          python -m pip install 'torch==${{ matrix.torch-version }}' --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
      - name: Check eager optimizer compatibility
        run: |
          python -m unittest discover -s tests -p test_optimizers.py -v
          python -m unittest discover -s tests -p test_conic.py -v
